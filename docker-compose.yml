x-app-build: &app-build
  build:
    context: .
    dockerfile: .docker/Dockerfile
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: forge
    DB_USERNAME: forge
    DB_PASSWORD: forge

services:
  app:
    <<: *app-build

  # Runs the test suite with code coverage (pcov is bundled in the image).
  # Coverage reports are written to ./storage/coverage (clover.xml, html, coverage-xml, junit.xml).
  coverage:
    <<: *app-build
    command: ["composer", "test-cover"]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 5
